<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">B3 exact algorithm recovery</title>
  <desc id="desc">A light-background circuit diagram showing the B3 Burau boundary matrix unit, the transformer late CLS representation, and the exact descent rule.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafb; }
      .panel { fill: #ffffff; stroke: #c8d1dd; stroke-width: 2; rx: 12; }
      .input { fill: #e8f4ff; stroke: #4f8fc7; stroke-width: 2; rx: 9; }
      .model { fill: #f1ecff; stroke: #7b65c9; stroke-width: 2; rx: 9; }
      .rule { fill: #fff4df; stroke: #c48a2b; stroke-width: 2; rx: 9; }
      .out { fill: #eaf7f0; stroke: #4d9b72; stroke-width: 2; rx: 9; }
      .title { font: 700 32px Inter, Arial, sans-serif; fill: #172033; }
      .sub { font: 500 17px Inter, Arial, sans-serif; fill: #4b5568; }
      .h { font: 700 19px Inter, Arial, sans-serif; fill: #172033; }
      .txt { font: 500 15px Inter, Arial, sans-serif; fill: #273044; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #4b5568; }
      .num { font: 700 23px Inter, Arial, sans-serif; fill: #172033; }
      .arrow { stroke: #536176; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #d8dee8; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#536176"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="58" y="58">B3 Exact Algorithm Recovery</text>
  <text class="sub" x="58" y="88">The model internally represents the algebraic object used by the theorem.</text>

  <rect class="panel" x="58" y="124" width="1084" height="430"/>

  <rect class="input" x="92" y="234" width="205" height="96"/>
  <text class="h" x="118" y="266">Burau matrix</text>
  <text class="txt" x="118" y="292">over (Z/2)[v]</text>
  <text class="small" x="118" y="314">degree-indexed slices</text>

  <path class="arrow" d="M 304 282 L 382 282"/>

  <rect class="input" x="394" y="234" width="230" height="96"/>
  <text class="h" x="420" y="266">Extremal slice</text>
  <text class="txt" x="420" y="292">unique matrix unit</text>
  <text class="small" x="420" y="314">E_ij at the boundary</text>

  <path class="arrow" d="M 632 282 L 710 282"/>

  <rect class="model" x="722" y="234" width="205" height="96"/>
  <text class="h" x="752" y="266">Transformer</text>
  <text class="txt" x="752" y="292">2 layers, CLS</text>
  <text class="small" x="752" y="314">attention readout</text>

  <path class="arrow" d="M 824 338 L 824 394"/>

  <rect class="model" x="694" y="406" width="260" height="86"/>
  <text class="h" x="724" y="438">Late CLS</text>
  <text class="txt" x="724" y="464">linear decoder recovers E_ij</text>

  <path class="arrow" d="M 962 449 L 1012 449"/>

  <rect class="rule" x="1018" y="406" width="92" height="86"/>
  <text class="h" x="1044" y="438">Rule</text>
  <text class="small" x="1035" y="462">unit column</text>
  <text class="small" x="1042" y="480">to descent</text>

  <path class="arrow" d="M 509 338 C 509 414, 608 449, 686 449"/>
  <text class="small" x="390" y="386">the theorem object is visible</text>

  <line class="thin" x1="92" y1="580" x2="1110" y2="580"/>
  <rect class="out" x="92" y="596" width="300" height="54"/>
  <text class="num" x="118" y="626">100.00%</text>
  <text class="small" x="220" y="622">exact boundary rule</text>
  <rect class="out" x="450" y="596" width="300" height="54"/>
  <text class="num" x="476" y="626">99.99%</text>
  <text class="small" x="570" y="622">decoded rule accuracy</text>
  <rect class="out" x="808" y="596" width="302" height="54"/>
  <text class="num" x="834" y="626">1.000</text>
  <text class="small" x="922" y="622">late CLS patch recovery</text>
</svg>
