<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">B4 signed frontier mechanism</title>
  <desc id="desc">A light-background mechanism diagram for B4 showing sign tokens, signed frontier bands, layer-1 heads, descent logits, hand-rule gap, and CLS probes.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafb; }
      .panel { fill: #ffffff; stroke: #c8d1dd; stroke-width: 2; rx: 12; }
      .input { fill: #e8f4ff; stroke: #4f8fc7; stroke-width: 2; rx: 9; }
      .frontier { fill: #f1ecff; stroke: #7b65c9; stroke-width: 2; rx: 9; }
      .head { fill: #fff4df; stroke: #c48a2b; stroke-width: 2; rx: 9; }
      .out { fill: #eaf7f0; stroke: #4d9b72; stroke-width: 2; rx: 9; }
      .gap { fill: #fff0f0; stroke: #c95757; stroke-width: 2; rx: 9; }
      .title { font: 700 32px Inter, Arial, sans-serif; fill: #172033; }
      .sub { font: 500 17px Inter, Arial, sans-serif; fill: #4b5568; }
      .h { font: 700 19px Inter, Arial, sans-serif; fill: #172033; }
      .txt { font: 500 15px Inter, Arial, sans-serif; fill: #273044; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #4b5568; }
      .num { font: 700 21px Inter, Arial, sans-serif; fill: #172033; }
      .arrow { stroke: #536176; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #c95757; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrowRed); }
      .thin { stroke: #d8dee8; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#536176"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#c95757"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="58" y="58">B4 Signed Frontier Mechanism</text>
  <text class="sub" x="58" y="88">The circuit-level object is a signed frontier readout, not a one-token B3-style rule.</text>

  <rect class="panel" x="58" y="124" width="1084" height="430"/>

  <rect class="input" x="88" y="214" width="170" height="94"/>
  <text class="h" x="122" y="246">B4 Burau</text>
  <text class="txt" x="112" y="272">3 x 3 coefficient</text>
  <text class="small" x="118" y="292">matrix over Z[v]</text>

  <path class="arrow" d="M 264 261 L 334 261"/>

  <rect class="input" x="346" y="214" width="190" height="94"/>
  <text class="h" x="386" y="246">Sign tokens</text>
  <text class="txt" x="382" y="272">0 / - / + per entry</text>
  <text class="small" x="374" y="292">93.2% full model</text>

  <path class="arrow" d="M 542 261 L 612 261"/>

  <rect class="frontier" x="624" y="214" width="210" height="94"/>
  <text class="h" x="668" y="246">Signed frontier</text>
  <text class="txt" x="662" y="272">leading/trailing r=8</text>
  <text class="small" x="660" y="292">90.6% boundary model</text>

  <path class="arrow" d="M 840 261 L 910 261"/>

  <rect class="head" x="922" y="214" width="160" height="94"/>
  <text class="h" x="966" y="246">Layer-1</text>
  <text class="txt" x="954" y="272">CLS attention</text>
  <text class="small" x="956" y="292">reads frontier</text>

  <path class="arrow" d="M 1002 316 L 1002 378"/>

  <rect class="out" x="892" y="390" width="220" height="86"/>
  <text class="h" x="942" y="424">Descent state</text>
  <text class="txt" x="934" y="450">late CLS probes</text>
  <text class="small" x="922" y="468">direct descent probe: 93.2%</text>

  <path class="dashed" d="M 730 316 L 730 378"/>
  <rect class="gap" x="610" y="390" width="240" height="86"/>
  <text class="h" x="662" y="424">Hand-rule gap</text>
  <text class="txt" x="646" y="450">best finite state: 85.1%</text>
  <text class="small" x="644" y="468">real collisions remain</text>

  <line class="thin" x1="88" y1="580" x2="1112" y2="580"/>
  <rect class="out" x="88" y="596" width="270" height="54"/>
  <text class="num" x="114" y="626">90.2%</text>
  <text class="small" x="200" y="622">boundary patch recovery</text>
  <rect class="out" x="402" y="596" width="300" height="54"/>
  <text class="num" x="428" y="626">90.6%</text>
  <text class="small" x="514" y="622">boundary-only accuracy</text>
  <rect class="out" x="746" y="596" width="366" height="54"/>
  <text class="num" x="772" y="626">not solved</text>
  <text class="small" x="884" y="616">small hand rules</text>
  <text class="small" x="884" y="636">underperform the model</text>
</svg>
